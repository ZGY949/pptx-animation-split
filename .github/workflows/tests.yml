name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: pptx-animation-split --version
      - run: pptx-animation-split split examples/demo.pptx demo-split.pptx
      - run: pptx-animation-split verify examples/demo.pptx demo-split.pptx
      - run: pptx-animation-split split examples/animation-cases.pptx animation-cases-split.pptx
      - run: pptx-animation-split verify examples/animation-cases.pptx animation-cases-split.pptx
      - run: pptx-animation-split split examples/interaction-repeat-cases.pptx interaction-repeat-split.pptx
      - run: pptx-animation-split verify examples/interaction-repeat-cases.pptx interaction-repeat-split.pptx
